 const x=i=>l+(w-l-r)*(points.length===1?.5:i/(points.length-1)),y=v=>t+(H-t-b)*(ceiling-v)/ceiling;
 let html='<svg class="plot" viewBox="0 0 '+w+' '+H+'" role="img" aria-label="Progress graph showing '+esc(key)+' across '+points.length+' logged exercises">';
 for(let i=0;i<=ticks;i++){let v=i*step,yy=y(v);html+='<line x1="'+l+'" x2="'+(w-r)+'" y1="'+yy+'" y2="'+yy+'" stroke="#37444c" stroke-dasharray="3 4"/><text x="'+(l-6)+'" y="'+(yy+4)+'" text-anchor="end" class="plot-text">'+v+'</text>'}
 let coord=points.map((p,i)=>x(i)+','+y(values[i])).join(' ');if(points.length>1)html+='<polyline points="'+coord+'" fill="none" stroke="#b5f56b" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>';
 points.forEach((p,i)=>{let name=esc(p.date||'Week '+p.week),v=values[i];html+='<circle class="chart-point" cx="'+x(i)+'" cy="'+y(v)+'" r="5" fill="#b5f56b" stroke="#1d232b" stroke-width="2"><title>'+name+': '+v+' '+key+'</title></circle>';if(points.length<=6||i===0||i===points.length-1||(points.length<=14&&i%2===0))html+='<text class="plot-text" x="'+x(i)+'" y="'+(H-16)+'" text-anchor="middle">'+esc((p.date||'W'+p.week).slice(5))+'</text>'});return html+'</svg>'
}

function calendarHTML(){let [year,month]=calendarMonth.split('-').map(Number);const first=new Date(year,month-1,1),days=new Date(year,month,0).getDate(),offset=(first.getDay()+6)%7;let title=first.toLocaleDateString('en-GB',{month:'long',year:'numeric'});let html='<div class="calendar-head"><button class="monthnav" onclick="moveMonth(-1)" aria-label="Previous month">‹</button><div class="month-title">'+esc(title)+'</div><button class="monthnav" onclick="moveMonth(1)" aria-label="Next month">›</button></div><div class="calendar">';['M','T','W','T','F','S','S'].forEach(d=>html+='<div class="weekday">'+d+'</div>');for(let i=0;i<offset;i++)html+='<div class="day blank"></div>';let today=localStamp().slice(0,10);for(let n=1;n<=days;n++){let d=calendarMonth+'-'+String(n).padStart(2,'0'),has=logs.some(x=>x.date===d);html+='<button class="day '+(has?'has-log ':'')+(d===selectedDate?'active ':'')+(d===today?'today':'')+'" onclick="pickDay(\''+d+'\')" aria-label="'+d+(has?' workout logged':'')+'">'+n+'</button>'}return html+'</div><div class="small" style="margin-top:14px">● Green dots mark days with logged workouts.</div>'}
function moveMonth(diff){const [y,m]=calendarMonth.split('-').map(Number);const d=new Date(y,m-1+diff,1);calendarMonth=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');render()}
function pickDay(d){selectedDate=d;editId=null;addingHistory=false;render()}
function dateHeading(d){let date=new Date(d+'T12:00:00');return date.toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long',year:'numeric'})}
function startEdit(id){addingHistory=false;editId=id;render();document.getElementById('editor')?.scrollIntoView({block:'nearest',behavior:'smooth'})}
function startAddHistory(){editId=null;addingHistory=true;render();document.getElementById('add-history')?.scrollIntoView({block:'nearest',behavior:'smooth'})}
function changeAddRoutine(r){addRoutine=r;addExercise=(ROUTINES[r]||[])[0]||'Cardio';render();document.getElementById('add-history')?.scrollIntoView({block:'nearest'})}
function changeAddExercise(e){addExercise=e;render();document.getElementById('add-history')?.scrollIntoView({block:'nearest'})}
function addHistoryHTML(){
 const types=[...Object.keys(ROUTINES),'Cardio','Abs'];
 const eList=ROUTINES[addRoutine]||[];
 if(eList.length&&!eList.includes(addExercise))addExercise=eList[0];
 const today=localStamp().slice(0,10);
 const fields=addRoutine==='Cardio'?'<div class="field"><label for="add-minutes">Duration (minutes)</label><input id="add-minutes" class="duration-input" type="number" min="1" max="1440" step="1" inputmode="numeric" placeholder="e.g. 20"></div>':addRoutine==='Abs'?'<p class="small">Mark your abs workout as completed — no sets or reps needed.</p>':setEditor('add-',addExercise,detailsFor(latest(addRoutine,addExercise),addExercise));
 return '<div class="card" id="add-history"><h3>Add a missed workout</h3><p class="small">Select an exercise for '+esc(dateHeading(selectedDate))+'. You can add several exercises without leaving this date.</p><div class="field"><label for="add-routine">Workout category</label><select id="add-routine" class="control" onchange="changeAddRoutine(this.value)">'+types.map(r=>'<option value="'+esc(r)+'" '+(r===addRoutine?'selected':'')+'>'+esc(r)+'</option>').join('')+'</select></div>'+(eList.length?'<div class="field"><label for="add-exercise">Exercise</label><select id="add-exercise" class="control" onchange="changeAddExercise(this.value)">'+eList.map(e=>'<option value="'+esc(e)+'" '+(e===addExercise?'selected':'')+'>'+esc(e)+'</option>').join('')+'</select></div>':'')+fields+'<div class="time-fields"><div class="field"><label for="add-date">Workout date</label><input id="add-date" type="date" value="'+esc(selectedDate)+'"></div><div class="field"><label for="add-time">Workout time</label><input id="add-time" type="time" value="18:00"></div></div><div class="field" style="margin-top:12px"><label for="add-week">Training week</label><input id="add-week" class="control" type="number" min="1" max="999" step="1" value="'+week+'"></div><div class="utility"><button class="primary" onclick="saveAddedHistory()">Save exercise</button><button class="secondary" onclick="addingHistory=false;render()">Done</button></div></div>';
}
function saveAddedHistory(){
 const d=document.getElementById('add-date').value,t=document.getElementById('add-time').value,w=Number(document.getElementById('add-week').value);
 if(!/^\d{4}-\d{2}-\d{2}$/.test(d)||!/^\d{2}:\d{2}$/.test(t)){alert('Please enter a valid date and time.');return}
 if(!Number.isInteger(w)||w<1||w>999){alert('Please enter a valid training week.');return}
 let item={id:'history-'+Date.now()+'-'+Math.random().toString(36).slice(2,9),routine:addRoutine,exercise:addRoutine==='Cardio'?'Cardio':addRoutine==='Abs'?'Abs completed':addExercise,week:w,date:d,time:t,timestamp:d+'T'+t+':00',source:'manual-history'};
 if(addRoutine==='Cardio'){
  const mins=Number(document.getElementById('add-minutes').value);
  if(!Number.isInteger(mins)||mins<1||mins>1440){alert('Please enter a cardio duration between 1 and 1440 minutes.');return}
  item.minutes=mins;item.value=mins+' minutes';
 }else if(addRoutine==='Abs'){
  if(logs.some(x=>x.routine==='Abs'&&x.date===d)){alert('An abs workout is already logged for this day.');return}
  item.value='Completed';
 }else{
  const sets=readSets('add-',addExercise);
  if(!sets.length||sets.some(s=>!Number.isInteger(s.reps)||s.reps<1)){alert('Each set needs at least one rep.');return}
  Object.assign(item,statsFor(sets,addExercise));item.value=formatSets(item);
 }
 logs.push(item);selectedDate=d;calendarMonth=d.slice(0,7);if(!save()){logs=logs.filter(x=>x!==item);alert('Unable to save this entry to browser storage. Please export a backup.');return}
 // Keep the form open for another exercise on the same selected day.
 render();document.getElementById('add-history')?.scrollIntoView({block:'nearest'});
}
function editHTML(){let x=logs.find(x=>x.id===editId);if(!x)return '';let ds=(x.timestamp||x.date+'T'+(x.time||'18:00')).slice(0,16),fields=x.routine==='Cardio'?'<div class="field"><label for="edit-minutes">Duration (minutes)</label><input id="edit-minutes" class="duration-input" type="number" min="1" max="1440" step="1" value="'+esc(x.minutes)+'"></div>':x.routine==='Abs'?'<p class="small">Abs completion has no weights, reps or sets.</p>':setEditor('edit-',x.exercise,detailsFor(x,x.exercise));return '<div class="card" id="editor"><h3>Edit '+esc(x.exercise)+'</h3><p class="small">Correct a logged entry, including its date and time.</p>'+fields+'<div class="time-fields"><div class="field"><label>Date</label><input id="edit-date" type="date" value="'+esc(ds.slice(0,10))+'"></div><div class="field"><label>Time</label><input id="edit-time" type="time" value="'+esc(ds.slice(11,16))+'"></div></div><div class="utility" style="margin-top:13px"><button class="primary" onclick="saveEdit()">Save changes</button><button class="secondary" onclick="editId=null;render()">Cancel</button><button class="danger" onclick="deleteEntry()">Delete entry</button></div></div>'}
function saveEdit(){let x=logs.find(x=>x.id===editId);if(!x)return;let d=document.getElementById('edit-date').value,t=document.getElementById('edit-time').value;if(!d||!t){alert('Please enter a date and time.');return}if(x.routine==='Cardio'){let m=Number(document.getElementById('edit-minutes').value);if(!Number.isInteger(m)||m<1||m>1440){alert('Please enter a valid duration in minutes.');return}x.minutes=m;x.value=m+' minutes'}else if(x.routine!=='Abs'){let details=readSets('edit-',x.exercise);if(!details.length||details.some(s=>s.reps<1)){alert('Each set needs at least one rep.');return}let v=statsFor(details,x.exercise);Object.assign(x,v,{value:formatSets({exercise:x.exercise,setDetails:details})})}Object.assign(x,{date:d,time:t,timestamp:d+'T'+t+':00'});selectedDate=d;calendarMonth=d.slice(0,7);editId=null;if(!save())alert('Changes are only in memory: unable to save to browser storage. Export a backup.');render()}
function deleteEntry(id=editId){let x=logs.find(x=>x.id===id);if(!x||!confirm('Delete this '+x.exercise+' entry? This cannot be undone.'))return;logs=logs.filter(y=>y.id!==id);editId=null;if(!save())alert('Browser storage not available. Export a backup.');render()}
function exportData(){const blob=new Blob([JSON.stringify(logs,null,2)],{type:'application/json'});let url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='gym-progress-v10-backup-'+localStamp().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function importData(ev){let file=ev.target.files?.[0];if(!file)return;let reader=new FileReader();reader.onload=()=>{try{let d=JSON.parse(reader.result);if(!Array.isArray(d)||!d.every(x=>x.routine&&x.exercise&&x.week&&x.value))throw Error('Invalid backup');if(confirm('Replace this Version 10 copy with '+d.length+' entries from your backup? Your earlier versions will not be affected.')){const previous=logs;logs=d.map(x=>normalise(structuredCopy(x)));if(!save()){logs=previous;alert('Import could not be saved.')}render()}}catch(e){alert('That is not a valid Gym Progress backup.')}};reader.readAsText(file)}
load();selectedDate=localStamp().slice(0,10);calendarMonth=selectedDate.slice(0,7);render();
</script></body></html>
